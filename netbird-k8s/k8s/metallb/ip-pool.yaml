apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: netbird-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.0.50/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: netbird-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - netbird-pool
