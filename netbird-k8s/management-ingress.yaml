apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netbird-management-api
  namespace: netbird
spec:
  ingressClassName: traefik
  rules:
    - host: netbird.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: netbird-management
                port:
                  number: 80
